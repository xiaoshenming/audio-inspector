name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      - run: python -m ruff check src tests
      - run: python -m compileall -q src tests
      - run: python -m build --wheel
      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/dev-pb2-wheel-check
          /tmp/dev-pb2-wheel-check/bin/python -m pip install dist/dev_pb2-*.whl
          PATH="/tmp/dev-pb2-wheel-check/bin:$PATH" bash scripts/preflight.sh
          PATH="/tmp/dev-pb2-wheel-check/bin:$PATH" bash scripts/preflight.sh --local-repair
