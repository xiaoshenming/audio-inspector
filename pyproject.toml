[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-pb2"
version = "0.1.0"
description = "Independent evidence-only TTS review module for BatchOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cn2an>=0.5.23,<1",
  "faster-whisper>=1.1,<2",
  "pypinyin>=0.55,<1",
]

[project.optional-dependencies]
batchops = ["tos>=2.9,<3"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9",
]

[project.scripts]
dev-pb2 = "dev_pb2.cli:main"
dev-pb2-close-loop = "dev_pb2.closure:main"
dev-pb2-batch-eval = "dev_pb2.batch_eval:main"
dev-pb2-prepare-shortlist = "dev_pb2.shortlist:main"
dev-pb2-iterate = "dev_pb2.iterate:main"
dev-pb2-worker-render = "dev_pb2.worker_render:main"
dev-pb2-worker-batch = "dev_pb2.worker_batch:main"
dev-pb2-summary = "dev_pb2.summary:main"
dev-pb2-verify-media = "dev_pb2.verify_media:main"
dev-pb2-rebuild = "dev_pb2.repair_media:main"
dev-pb2-qwen-asr = "dev_pb2.qwen_asr:main"
dev-pb2-semantic-review = "dev_pb2.semantic_review:main"
dev-pb2-screening-report = "dev_pb2.screening_report:main"
dev-pb2-review-server = "dev_pb2.review_server:main"
dev-pb2-literal-asr = "dev_pb2.literal_asr:main"
dev-pb2-literal-reading = "dev_pb2.literal_reading:main"
dev-pb2-synthetic-corpus = "dev_pb2.synthetic_corpus:main"
dev-pb2-synthetic-tts = "dev_pb2.synthetic_tts:main"
dev-pb2-synthetic-eval = "dev_pb2.synthetic_eval:main"
dev-pb2-synthetic-challenge = "dev_pb2.synthetic_challenge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_pb2 = ["review_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
