[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-inspector"
version = "0.1.0"
description = "Evidence-only TTS audio inspection for rendered teaching videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cn2an>=0.5.23,<1",
  "faster-whisper>=1.1,<2",
  "pypinyin>=0.55,<1",
]

[project.optional-dependencies]
pronunciation = [
  "g2pW>=0.1.1",
  "torch>=2.2",
  "transformers>=4.40,<5",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9",
]

[project.scripts]
audio-inspector = "audio_inspector.cli:main"
audio-inspector-polyphone-prepare = "audio_inspector.polyphone_prepare:main"
audio-inspector-polyphone-run = "audio_inspector.polyphone_batch:main"
audio-inspector-polyphone-report = "audio_inspector.polyphone_report:main"
audio-inspector-qwen-asr = "audio_inspector.qwen_asr:main"
audio-inspector-semantic-review = "audio_inspector.semantic_review:main"
audio-inspector-screening-report = "audio_inspector.screening_report:main"
audio-inspector-review-server = "audio_inspector.review_server:main"
audio-inspector-literal-asr = "audio_inspector.literal_asr:main"
audio-inspector-literal-reading = "audio_inspector.literal_reading:main"
audio-inspector-synthetic-corpus = "audio_inspector.synthetic_corpus:main"
audio-inspector-synthetic-tts = "audio_inspector.synthetic_tts:main"
audio-inspector-synthetic-eval = "audio_inspector.synthetic_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_inspector = ["review_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
